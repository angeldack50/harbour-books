
name: Harbour Books Reusable Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      aws-role-arn:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image using Makefile
        env:
          IMAGE_URI: 695496430876.dkr.ecr.ap-southeast-2.amazonaws.com/harbour-books
          IMAGE_TAG: ${{ github.sha }}
        run: make build

      - name: Push image using Makefile
        env:
          IMAGE_URI: 695496430876.dkr.ecr.ap-southeast-2.amazonaws.com/harbour-books
          IMAGE_TAG: ${{ github.sha }}
        run: make push

      - name: Deploy to EC2 via SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="695496430876.dkr.ecr.ap-southeast-2.amazonaws.com/harbour-books:${IMAGE_TAG}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-08d354052cd096638" \
            --document-name "AWS-RunShellScript" \
            --region "ap-southeast-2" \
            --parameters "$(jq -nc --arg image "$IMAGE" '{
              commands: [
                "set -eu",
                "aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 695496430876.dkr.ecr.ap-southeast-2.amazonaws.com",
                ("docker pull " + $image),
                "docker stop harbour-books || true",
                "docker rm harbour-books || true",
                ("docker run -d --name harbour-books --restart unless-stopped -p 80:8000 " + $image),
                "for i in $(seq 1 30); do if curl -fsS http://localhost:80/health; then exit 0; fi; sleep 2; done; exit 1"
              ]
            }')" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-08d354052cd096638" \
            --region "ap-southeast-2" || {
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-08d354052cd096638" \
                --region "ap-southeast-2" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json
              exit 1
            }

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-08d354052cd096638" \
            --region "ap-southeast-2" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
