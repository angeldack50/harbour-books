name: Harbour Books CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          separator = "&" if "?" in url else "?"
          req = urllib.request.Request(
              url + separator + "audience=sts.amazonaws.com",
              headers={"Authorization": "Bearer " + token}
          )
          with urllib.request.urlopen(req) as response:
              jwt = json.load(response)["value"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("sub:", claims.get("sub"))
          print("aud:", claims.get("aud"))
          PY


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::695496430876:role/harbour-books-github-actions-role
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t harbour-books:${{ github.sha }} .

      - name: Tag and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag harbour-books:$IMAGE_TAG $ECR_REGISTRY/harbour-books:$IMAGE_TAG
          docker push $ECR_REGISTRY/harbour-books:$IMAGE_TAG

      - name: Deploy to EC2 via SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="695496430876.dkr.ecr.ap-southeast-2.amazonaws.com/harbour-books:${IMAGE_TAG}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-08d354052cd096638" \
            --document-name "AWS-RunShellScript" \
            --region "ap-southeast-2" \
            --parameters "$(jq -nc --arg image "$IMAGE" '{
              commands: [
                "set -eu",
                "aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 695496430876.dkr.ecr.ap-southeast-2.amazonaws.com",
                ("docker pull " + $image),
                "docker stop harbour-books || true",
                "docker rm harbour-books || true",
                ("docker run -d --name harbour-books --restart unless-stopped -p 8000:8000 " + $image),
                "for i in $(seq 1 30); do if curl -fsS http://localhost:8000/health; then exit 0; fi; sleep 2; done; exit 1"
              ]
            }')" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-08d354052cd096638" \
            --region "ap-southeast-2" || {
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-08d354052cd096638" \
                --region "ap-southeast-2" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json
              exit 1
            }

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-08d354052cd096638" \
            --region "ap-southeast-2" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
